    <script>
        function handleFormSubmit(ervent) {
            event.preventDefault();
            if (!validateForm()) {
                return;
            }
            const name = document.getElementById("name").value.trim();
            const maxOffer = document.getElementById("maxOffer").value.trim();
            const description = document.getElementById('description').value.trim();
            fetch('/admin/category/name', {
                method: 'POST',
                headers: {
                    'content-type': 'application/json',

                },
                body: JSON.stringify({ name, description, maxOffer })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error);
                        })
                    }
                    return response.json();
                })
                .then(data=>{
                    location.reload();
                })
                .catch(error=>{
                    if(error.message === "Category already exists"){
                        Swal.fire({
                            icon: 'error',
                            title: 'Oops',
                            text: 'Category already exists',
                        })
                    }else {
                        Swal.fire({
                            icon:'error',
                            title:'oops',
                            text: 'An error occured while adding the category'
                        })
                    }
                })
        }

        function validateForm() {
            clearErrorMessages();
            const name = document.getElementById("name").value.trim();
            const description = document.getElementById('description').value.trim();
            isValid = true;

            if (name === '') {
                displayErrorMessage('name-error', "Please enter a name");
                isValid = false;
            }

            if (description === '') {
                displayErrorMessage('description-error', "Please enter the description");
                isValid = false;
            }
        }

        function displayErrorMessage(elementId, message) {
            var errorElement = document.getElementById(elementId);
            errorElement.innerText = message;
            errorElement.style.display = "block";
        }

        function clearErrorMessages(elementId, message) {
            var errorElements = document.getElementsByClassName("error-message");
            Array.from(errorElements).forEach((element) => {
                element.innerText = "";
                element.style.display = none;
            })
            errorElement.innerText = message;
            errorElement.style.display = "block";
        }

        // Mobile menu toggle functionality
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        // Toggle sidebar on menu button click
        if (menuToggle && sidebar && overlay) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            });

            // Close sidebar when clicking overlay
            overlay.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            });
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth < 1024 && sidebar && menuToggle) {
                if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                    sidebar.classList.add('-translate-x-full');
                    if (overlay) overlay.classList.add('hidden');
                }
            }
        });

        // Handle sidebar visibility on window resize
        window.addEventListener('resize', () => {
            if (sidebar && overlay) {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.add('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                }
            }
        });
